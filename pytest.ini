; 1. pytest.ini

; Where it goes: In the root LLM/ folder.
; Why it exists: When you run tests, Python needs to know 
; where your "root" folder is so it can properly 
; import files (e.g., from configs import...). Without this, 
; Python will throw a ModuleNotFoundError.

# pytest.ini
[pytest]
# This tells pytest to add the current directory ('.') to the Python path.
# It allows our test files to easily import our internal modules.
pythonpath = .
